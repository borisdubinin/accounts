databaseChangeLog:
  - changeSet:
      id: 004-create-transfers-table
      author: borisdubinin
      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: iban_from
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: sender_balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: sender_currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: iban_to
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: receiver_currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: receiver_balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false