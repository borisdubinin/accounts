databaseChangeLog:
  - changeSet:
      id: 005-create-favorite-transfers
      author: borisdubinin
      changes:
        - createTable:
            tableName: favorite_transfers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: iban_from
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: iban_to
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP